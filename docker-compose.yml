# Observability stack.
#   Phase 1: Prometheus (metrics)
#   Phase 2: + OpenTelemetry Collector, Tempo (traces), Grafana (viewer)
#   Phase 3: metrics now flow  services -> Collector -> Prometheus  (with exemplars)
#   Phase 4: + Loki (logs): services -> Collector -> Loki
#   Phase 5: Prometheus loads recording/alert/SLO rules; Grafana loads 4 dashboards
#
# Start:  docker compose up -d        Stop:  docker compose down   (data survives; add -v to wipe it)
#
# Every published port is bound to 127.0.0.1, so these tools are reachable only from THIS computer,
# not from other machines on your network. (Grafana below allows anonymous admin access for the lab,
# which would be unsafe if it were exposed.)
#
# LEARNER EDITION: the four Python services can also run in Docker, so nothing needs installing except
# Docker itself (works the same on Windows, macOS and Linux). They live in the "app" profile, which means
# a plain `docker compose up -d` still starts ONLY the observability stack, exactly as before.
#   Everything:   python run.py up        (or: docker compose --profile app up --build -d --wait)
#   Stop + clean: python run.py down      (or: docker compose --profile app down --remove-orphans --volumes)
name: shopsense   # pinned so volume and network names do not depend on the folder name

# Settings shared by the four Python services.
x-python-service: &python-service
  build: .
  image: shopsense-app:local
  restart: "no"
  profiles: ["app"]
  environment: &python-env
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    GATEWAY_URL: http://gateway:8000
    ORDERS_URL: http://orders:8001
    INVENTORY_URL: http://inventory:8002
    AGENTS_URL: http://agents:8003
    LOKI_URL: http://loki:3100

services:
  inventory:
    <<: *python-service
    container_name: shopsense-inventory
    command: ["python", "-m", "uvicorn", "services.inventory.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      - otel-collector

  orders:
    <<: *python-service
    container_name: shopsense-orders
    command: ["python", "-m", "uvicorn", "services.orders.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:${ORDERS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      inventory:
        condition: service_healthy

  agents:
    <<: *python-service
    container_name: shopsense-agents
    command: ["python", "-m", "uvicorn", "services.agents.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      <<: *python-env
      # Passed through from your shell or from .env (docker compose reads .env next to this file for ${...}).
      # Nothing is baked into the image. Leave the key empty to use the built-in mock model only.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-shopsense}
    ports:
      - "127.0.0.1:${AGENTS_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s     # importing LangChain + LangGraph takes a while
    depends_on:
      orders:
        condition: service_healthy

  gateway:
    <<: *python-service
    container_name: shopsense-gateway
    command: ["python", "-m", "uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      agents:
        condition: service_healthy
      loki:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: shopsense-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle            # allows POST /-/reload after editing the config
      - --enable-feature=exemplar-storage # keep exemplars (metric -> trace links); off by default
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/rules:/etc/prometheus/rules:ro   # recording rules, alerts, SLOs (Phase 5)
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes the name work on any Docker setup

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: shopsense-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318"                 # OTLP over HTTP: where our Python services send telemetry
      - "127.0.0.1:4317:4317"                 # OTLP over gRPC
      - "127.0.0.1:8889:8889"                 # the metrics page Prometheus scrapes (published only for our own checks)
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  loki:
    image: grafana/loki:3.7.9
    container_name: shopsense-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "0"                                 # run as root so the named volume is writable (lab only)
    ports:
      - "127.0.0.1:3100:3100"                 # Loki's API (Grafana and our checks query it here)
    volumes:
      - ./infra/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.10.10
    container_name: shopsense-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"                                 # run as root so the named volume is writable (lab only)
    ports:
      - "127.0.0.1:3200:3200"                 # Tempo's query API (used by Grafana and our checks)
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.5
    container_name: shopsense-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # no login screen: convenient for a local lab
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"   # port 3000 is often taken on Macs: set GRAFANA_PORT to change it
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro   # dashboard JSON files
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
  loki-data:
