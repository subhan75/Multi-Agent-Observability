# Prometheus configuration. Reload without restarting: POST http://localhost:9090/-/reload
global:
  scrape_interval: 5s       # how often to visit every target (15s is typical; 5s makes labs feel live)
  evaluation_interval: 15s  # how often recording rules and alert rules are evaluated (infra/rules/)

# Recording rules, alert rules and SLOs (Phase 5). Every .yml in this folder is loaded.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus watching itself: a good first target to query.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # PHASE 3 CHANGE. In Phase 1 Prometheus visited each of our four services directly.
  # Now the services push their metrics (OpenTelemetry) to the Collector, and Prometheus visits
  # ONE place: the Collector's metrics page.
  - job_name: otel-collector
    honor_labels: true      # keep the `job` label the Collector already set (job="orders", "gateway"...)
                            # instead of overwriting it with "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # The Collector's own health numbers (how many spans/metrics it received, refused, dropped).
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
