# Tells Grafana to load every dashboard JSON file found in the folder below, and to file them
# under a "ShopSense" folder in the UI. Grafana re-checks the folder every 10 s, BUT on Docker Desktop for
# Windows file changes inside a mounted folder are often not noticed. If you edit a dashboard JSON and
# nothing changes, run:  docker compose restart grafana   (a fresh start always loads the current files).
apiVersion: 1

providers:
  - name: shopsense
    folder: ShopSense
    type: file
    allowUiUpdates: true          # you may tweak a dashboard in the UI (changes are lost on restart; export the JSON to keep them)
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards   # mounted from infra/grafana/dashboards (see docker-compose.yml)
