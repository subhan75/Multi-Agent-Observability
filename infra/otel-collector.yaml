# OpenTelemetry Collector: the "post office" between our services and the storage tools.
# Our services send ALL telemetry here (one address). Where it goes next is decided by this
# file, so we can change storage backends without touching any Python code.
#
#   services ──OTLP──► [ receivers ] ─► [ processors ] ─► [ exporters ]
#                                                          ├─ traces  ──► Tempo
#                                                          ├─ metrics ──► a /metrics page that Prometheus scrapes
#                                                          └─ logs    ──► Loki

receivers:
  otlp:                       # "OTLP" = the OpenTelemetry wire protocol
    protocols:
      http:                   # our Python services use this one (port 4318)
        endpoint: 0.0.0.0:4318
      grpc:                   # the other flavour of OTLP (port 4317), for completeness
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:             # safety valve: refuse data instead of running out of memory
    check_interval: 1s
    limit_mib: 256
  batch:                      # group data into batches: far fewer, bigger network sends
    timeout: 2s

exporters:
  otlp/tempo:                 # send traces on to Tempo (inside the Docker network)
    endpoint: tempo:4317
    tls:
      insecure: true          # plain text is fine inside our private Docker network
  prometheus:                 # NOT a push: this opens a /metrics page that Prometheus scrapes
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true # the text format that can carry EXEMPLARS (links from a metric to a trace)
    metric_expiration: 30s    # forget a series 30 s after its service stops reporting (see lab notes)
  otlphttp/loki:              # NEW in Phase 4: push logs to Loki's built-in OTLP endpoint
    endpoint: http://loki:3100/otlp
  debug:                      # also print a short summary to the Collector's own log
    verbosity: basic

service:
  pipelines:
    traces:                   # a pipeline = receivers -> processors -> exporters
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    metrics:                  # NEW in Phase 3: the same receiver feeds a second pipeline
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:                     # NEW in Phase 4: the same receiver feeds a third pipeline
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki, debug]
  telemetry:                  # the Collector's OWN health numbers (spans received, dropped...)
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
